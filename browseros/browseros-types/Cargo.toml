[package]
name = "browseros-types"
version = "0.1.0"
edition = "2021"
description = "Canonical types, event hierarchy, message protocol, error system, and shared contracts for the BrowserOS runtime"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"

[dev-dependencies]
tempfile = "3"
proptest = "1"
