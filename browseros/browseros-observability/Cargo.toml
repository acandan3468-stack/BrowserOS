[package]
name = "browseros-observability"
version = "0.1.0"
edition = "2021"
description = "Observability foundation for BrowserOS — Logger, MetricsRegistry, Tracer, diagnostics"

[dependencies]
browseros-types = { path = "../browseros-types" }
browseros-config = { path = "../browseros-config" }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
