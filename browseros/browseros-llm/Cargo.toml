[package]
name = "browseros-llm"
version = "0.1.0"
edition = "2021"
description = "Provider-agnostic LLM Gateway for BrowserOS — routing, fallback, cost tracking, streaming, MCP adapter"

[dependencies]
browseros-types = { path = "../browseros-types" }
browseros-event-bus = { path = "../browseros-event-bus" }
browseros-observability = { path = "../browseros-observability" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
ureq = { version = "2", features = ["json"] }

[dev-dependencies]
tempfile = "3"
