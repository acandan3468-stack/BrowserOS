[package]
name = "browseros-mcp"
version = "0.1.0"
edition = "2021"
description = "MCP server for BrowserOS — external interface for the entire platform"

[dependencies]
browseros-runtime = { path = "../browseros-runtime" }
browseros-llm = { path = "../browseros-llm" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
tempfile = "3"
