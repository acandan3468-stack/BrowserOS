[package]
name = "browseros-bridge"
version = "0.1.0"
edition = "2021"
description = "Stable abstraction layer between BrowserOS and browser engines. Pure trait and type definitions with zero protocol dependencies."

[dependencies]
browseros-types = { path = "../browseros-types" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
uuid = { version = "1", features = ["v7", "serde"] }
